name: test nix

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Remove unnecessary stuff
      run: sudo rm -rf /usr/share/dotnet && sudo rm -rf /opt/ghc && sudo rm -rf "/usr/local/share/boost" && sudo rm -rf "$AGENT_TOOLSDIRECTORY" && sudo rm -rf /usr/local/lib/android
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-25.11
    - uses: actions/checkout@v4
    - name: Build rgb-led
      run: nix-build
      working-directory: embedded/common/lib/rgb-led/
    - name: Build config-portal
      run: nix-build
      working-directory: embedded/common/lib/config-portal/
    - name: Build tft-display
      run: nix-build
      working-directory: embedded/common/lib/tft-display/
    - name: Build wifi
      run: nix-build
      working-directory: embedded/common/lib/wifi/
    - name: Build simulator
      run: nix-build
      working-directory: embedded/common/simulator/
    - name: Build info-panel-lib
      run: nix-build
      working-directory: embedded/info-panel-lib/
    - name: Build info-panel
      run: nix-build
      working-directory: embedded/info-panel/
